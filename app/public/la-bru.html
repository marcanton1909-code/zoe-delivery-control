<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>Mackavi Cerveza La Bru</title>

  <script>
    if (
      sessionStorage.getItem('mackavi_la_bru_access') !== '1'
    ) {
      location.replace('/#');
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #090908;
      color: #f4eee2;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Inter,
        Arial,
        sans-serif;
    }

    body {
      min-height: 100dvh;
      background:
        radial-gradient(
          circle at 80% 5%,
          rgba(182, 126, 37, .13),
          transparent 30%
        ),
        #090908;
    }

    .shell {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding:
        max(28px, env(safe-area-inset-top))
        0
        max(28px, env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 64px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(214, 169, 76, .28);
      border-radius: 14px;
      background: #11100e;
      color: #d8ad57;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .brand-copy small {
      display: block;
      margin-bottom: 2px;
      color: #8e877a;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .brand-copy strong {
      font-size: 15px;
      font-weight: 560;
    }

    .exit {
      padding: 10px 13px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px;
      background: transparent;
      color: #b8b0a2;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
    }

    .hero {
      min-height: min(620px, calc(100dvh - 130px));
      margin-top: 28px;
      padding: clamp(28px, 7vw, 76px);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 32px;
      overflow: hidden;
      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.025),
          rgba(255,255,255,0)
        ),
        #0d0c0a;
    }

    .eyebrow {
      margin-bottom: 15px;
      color: #d8ad57;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 850px;
      margin: 0;
      font-size: clamp(44px, 8vw, 96px);
      font-weight: 500;
      line-height: .94;
      letter-spacing: -.06em;
    }

    .subtitle {
      max-width: 600px;
      margin: 24px 0 0;
      color: #a49c8d;
      font-size: clamp(15px, 2vw, 18px);
      line-height: 1.6;
    }

    .status {
      display: inline-flex;
      width: fit-content;
      margin-top: 30px;
      padding: 8px 11px;
      border: 1px solid rgba(80, 190, 115, .18);
      border-radius: 999px;
      background: rgba(80, 190, 115, .07);
      color: #9ad6aa;
      font-size: 11px;
      font-weight: 600;
    }

    @media (max-width: 700px) {
      .shell {
        width: min(100% - 24px, 1180px);
      }

      .topbar {
        min-height: 54px;
      }

      .hero {
        min-height: calc(100dvh - 110px);
        margin-top: 16px;
        border-radius: 24px;
      }

      .brand-copy small {
        display: none;
      }
    }

    @media (min-width: 701px) and (max-width: 1180px) {
      .shell {
        width: min(100% - 32px, 1180px);
      }

      .hero {
        min-height: 72dvh;
      }
    }
  </style>
</head>

<body>

  <main class="shell">

    <header class="topbar">

      <div class="brand">
        <div class="mark">LB</div>

        <div class="brand-copy">
          <small>Mackavi · SaaS privado</small>
          <strong>Cerveza La Bru</strong>
        </div>
      </div>

      <button
        class="exit"
        onclick="
          sessionStorage.removeItem('mackavi_la_bru_access');
          location.href='/#';
        "
      >
        Salir
      </button>

    </header>

    <section class="hero">

      <div class="eyebrow">
        Mackavi · Cerveza La Bru
      </div>

      <h1>
        Cerveza La Bru
      </h1>

      <p class="subtitle">
        Espacio operativo privado. La estructura funcional
        se configurará en la siguiente etapa.
      </p>

      <div class="status">
        Acceso autorizado
      </div>

    </section>

  </main>

</body>
</html>
